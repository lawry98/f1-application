name: Deploy backend

# Deploys the backend to Fly after CI passes on a push to main: the commit CI passed, and only
# while it is still main's tip. A manual (workflow_dispatch) run deploys main's tip and skips the
# CI gate. The frontend deploys itself, through Vercel's Git integration.
#
# Until the FLY_API_TOKEN secret exists, every run ends green with its deploy steps skipped, so
# main never goes red before setup (scripts/deploy-wizard.sh sets the secret last).
# workflow_run fires only for a workflow file on the default branch, so none of this runs before
# it is merged.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly
    # FLY_API_TOKEN is a secret of this environment, which only main may use, so no workflow on
    # another branch can read it. That never blocks this job: a workflow_run job always runs as
    # main, whatever branch CI ran on, so the `if:` below is still the gate. A repository secret
    # of the same name would still resolve here, and every branch can read that one, so the token
    # must exist only in the environment.
    environment: production
    # One deploy at a time, and a queued one waits rather than cancelling a deploy mid-flight. It
    # is on the job, not the workflow, so a run whose `if:` below skips the job (a red CI) never
    # enters the group and cannot replace a pending deploy of an earlier green commit.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    # workflow_run fires whatever CI's conclusion, and for pull-request runs of a branch named
    # main too, so both are checked. A manual run has no workflow_run and may only deploy main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The commit this run deploys. On workflow_run, github.sha is main's tip, not what CI tested.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Secrets cannot appear in an `if:`, and a missing one reads as an empty string, so its
      # presence is turned into an output every later step is gated on. The token itself only
      # ever reaches the deploy step: this one gets a boolean.
      - name: Check for FLY_API_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::FLY_API_TOKEN is not set. Run scripts/deploy-wizard.sh (README → Deployment)."
          fi

      # CI runs finish out of order, and re-running an old one fires this again with its old
      # commit, so deploying whatever arrives could roll production back behind the frontend. A
      # commit main has moved past is skipped: the tip's own CI run deploys the tip. Failing to
      # read the tip fails the job, rather than guessing either way.
      - name: Check the commit is still main's tip
        id: tip
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ $SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Deploy failed::No commit SHA to deploy."
            exit 1
          fi
          if ! tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/heads/main" --jq .sha) ||
            ! [[ $tip =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Deploy failed::Could not read main's tip, so nothing was deployed."
            exit 1
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::$SHA is no longer main's tip, $tip is. That commit's own CI run deploys it."
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true' && steps.tip.outputs.current == 'true'
        with:
          ref: ${{ env.SHA }}
          # flyctl uploads the directory to Fly's builder; with the default, .git/config would
          # carry the job token and only .dockerignore would keep it out.
          persist-credentials: false

      # Tag 1.6 is the Node 24 build; the newest GitHub *release*, 1.5, is a Node 20 action.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.present == 'true' && steps.tip.outputs.current == 'true'
        with:
          version: 0.4.115

      # --ha=false matters only if the app has no machine (say, after one was destroyed): without
      # it Fly would create two. --image-label tags the image with the commit, so
      # `fly releases --image` names the commit each release runs.
      - name: Deploy
        if: steps.token.outputs.present == 'true' && steps.tip.outputs.current == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --image-label "$SHA"
