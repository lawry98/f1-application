[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",  # module-level import not at top of file (needed in main.py after load_dotenv)
    "E501",  # line too long — prompt strings are data, not code
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# The backend is not an installable package — modules import as `from config import ...`
# and `from tools.x import ...`. This puts backend/ on sys.path so tests resolve the
# same way the app does. Run pytest from backend/, matching `cd backend && ruff check .`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-q",
    "--cov=agent",
    "--cov=api",
    "--cov=tools",
    "--cov=config",
    "--cov-report=term-missing",
]

[tool.coverage.report]
# Floor set to the achieved suite coverage (99%) rounded down to the nearest 5.
fail_under = 95
